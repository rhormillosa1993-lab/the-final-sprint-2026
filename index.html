<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	
	<title>The Final Stretch - Fortune Cookie</title>
	<link rel="stylesheet" href="style copy.css">
</head>

<body>
<div class="container">
		<div id="StartScreen">
			<h1>The Final Stretch 2026</h1>
			<p>Enter your name to receive your fortune</p>
			
			<input type="text" id="username" placeholder="Enter your name">
			<button id="startBtn">Continue</button>
		</div>
		
		<div id="fortuneScreen" style="display:none;">
		<h1>The Final Stretch 2026</h1>
		<p> Click the fortune cookie to reveal your message!</p>
		
		<button id="fortuneBtn">
			 <span class ="cookie-left"></span>
			 <span class ="cookie-right"></span>
			 <span class ="fortune-paper"></span>
		</button>
		
		<div id="fortuneText"></div>
		</div>
</div>

<script src="script.js"></script>
</body>
</html>
